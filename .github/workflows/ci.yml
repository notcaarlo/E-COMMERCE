name: CI — Concurrency Tests & Production Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: PostgreSQL ACID Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Concurrency & State Machine Tests (Vitest + PGlite PostgreSQL)
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
