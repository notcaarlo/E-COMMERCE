version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stockguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
